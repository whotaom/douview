name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a578e442d802a4e9ee1974773c5" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Prepare Keystore & Environment
        run: |
          chmod +x gradlew

          # 1. 恢复 debug.keystore 签名证书（在根目录与 app/ 目录双重部署）
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -f "app/debug.keystore.base64" ]; then
            base64 -d app/debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          # 2. 恢复正式生产环境签名密钥库 my-upload-key.jks（在根目录与 app/ 目录双重部署）
          if [ -f "my-upload-key.jks.base64" ]; then
            echo "Restoring my-upload-key.jks from base64..."
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks
          elif [ -f "app/my-upload-key.jks.base64" ]; then
            base64 -d app/my-upload-key.jks.base64 > my-upload-key.jks
          fi

          if [ ! -f "my-upload-key.jks" ] && [ ! -f "app/my-upload-key.jks" ]; then
            echo "Generating fallback production keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass doumou2026 -alias upload -keypass doumou2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Doumou Live, OU=Release, O=Doumou, L=Shenzhen, ST=Guangdong, C=CN"
          fi

          # 确保根目录和 app/ 目录均具备 my-upload-key.jks
          if [ -f "my-upload-key.jks" ]; then
            cp my-upload-key.jks app/my-upload-key.jks
          elif [ -f "app/my-upload-key.jks" ]; then
            cp app/my-upload-key.jks my-upload-key.jks
          fi

          # 3. 确保 .env 文件存在供 Secrets Gradle 插件读取
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi
          cp .env app/.env 2>/dev/null || true

      - name: Build Production Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'doumou2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'doumou2026' }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon -Djava.awt.headless=true
          cd app/build/outputs/apk/release/
          if [ -f "app-release.apk" ]; then
            cp app-release.apk douv-1.0.1.apk
            cp app-release.apk douview-1.0.1.apk
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true || true

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouView-Release-v1.0.1-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouView-Debug-v1.0.1-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
