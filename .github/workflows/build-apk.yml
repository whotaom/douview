name: Build Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # 仅用于打 tag 时创建 Release

jobs:
  build:
    name: Build & Export app-release.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 使用仓库根目录已有的 my-upload-key.jks（与 AI Studio 一致）。
      # 若该文件缺失，则从 my-upload-key.jks.base64 还原。
      # 显式设置 KEYSTORE_PATH，避免 Gradle 去 app/ 目录里找。
      - name: Locate release keystore
        run: |
          KS="$GITHUB_WORKSPACE/my-upload-key.jks"
          if [ ! -s "$KS" ]; then
            if [ -s "$GITHUB_WORKSPACE/my-upload-key.jks.base64" ]; then
              base64 -d "$GITHUB_WORKSPACE/my-upload-key.jks.base64" > "$KS"
            else
              echo "::error::仓库中找不到 my-upload-key.jks 或 my-upload-key.jks.base64"
              exit 1
            fi
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      # 提前校验口令和别名，出错时给出明确提示（Gradle 的报错很绕）
      - name: Check keystore password and alias
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::未设置 Secrets: STORE_PASSWORD / KEY_PASSWORD"
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload > /dev/null \
            || { echo "::error::密钥库口令不正确，或其中不存在别名 upload"; exit 1; }

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouView-Release-v1.0.1-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "$GITHUB_REF_NAME" --generate-notes
